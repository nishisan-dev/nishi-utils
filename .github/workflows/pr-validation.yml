name: PR Validation Pipeline

on:
  push:
    branches:
      - main
      - feature/queue-consumer
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  unit-tests:
    name: Standard Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The NGrid cluster resilience suite (in-process + Docker) is excluded here: it is timing and
      # resource sensitive and does not pass reliably on hosted runners. Run it locally with
      # `mvn test -Presilience` / `mvn verify -Pdocker-resilience`.
      - name: Run unit tests with coverage (NGrid resilience suite excluded)
        run: flock /tmp/nishi-utils-maven.lock mvn -B verify -pl nishi-utils-core,nishi-utils-oss,nishi-utils-ngrrd-cluster -am -DexcludeNgrid=true -Dsurefire.rerunFailingTestsCount=1

      - name: Verify map checkpoint and interrupted-install regression tests
        run: flock /tmp/nishi-utils-maven.lock mvn -B test -pl nishi-utils-core -Dtest=NMapCheckpointTest,NMapPersistenceCloseTest,MapSnapshotDurabilityTest,SnapshotCheckpointFenceTest,LocalApplyTrackingTest,LeaderSyncGateTest

      - name: Verify journal compatibility with the real 8.10.2 reader
        run: |
          legacy_source_dir="$(mktemp -d)"
          trap 'rm -rf "$legacy_source_dir"' EXIT
          # Pin the published implementation rather than reconstructing a legacy reader.
          git show 20cff18c8ee4fc2e85e4497972a9b5683d7b02ce:nishi-utils-ngrrd-cluster/src/main/java/dev/nishisan/utils/oss/cluster/node/SeriesLifecycleJournal.java > "$legacy_source_dir/SeriesLifecycleJournal.java"
          flock /tmp/nishi-utils-maven.lock mvn -B test -pl nishi-utils-ngrrd-cluster -am -Dtest=SeriesLifecycleJournalCompatibilityTest -Dsurefire.failIfNoSpecifiedTests=false -Dngrrd.journal.legacySource="$legacy_source_dir/SeriesLifecycleJournal.java"

      - name: Verify checkpoint recovery after migration
        run: flock /tmp/nishi-utils-maven.lock mvn -B test -pl nishi-utils-ngrrd-cluster -am -Pngrrd-cluster -Dtest=CheckpointAfterMigrationClusterTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Verify seed discovery and TCP routing
        run: flock /tmp/nishi-utils-maven.lock mvn -B test -pl nishi-utils-core -Dtest=TcpTransportConcurrentMeshTest,ProxyRoutingIntegrationTest,UndeliverableRequestIntegrationTest,TransportCompressionClusterTest

      - name: Verify continuous ingestion with two virtual-thread carriers
        env:
          JAVA_TOOL_OPTIONS: -Djdk.virtualThreadScheduler.parallelism=2
        run: flock /tmp/nishi-utils-maven.lock mvn -B test -pl nishi-utils-ngrrd-cluster -am -Pngrrd-cluster -Dtest=ContinuousIngestionRebalanceClusterTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Validate conditional series deletion and catalog quarantine
        run: flock /tmp/nishi-utils-maven.lock mvn -B test -pl nishi-utils-ngrrd-cluster -am -Pngrrd-cluster -Dtest=SeriesDeleteClusterTest -Dsurefire.failIfNoSpecifiedTests=false


      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            nishi-utils-core/target/site/jacoco/
            nishi-utils-oss/target/site/jacoco/
            nishi-utils-ngrrd-cluster/target/site/jacoco/
          retention-days: 14
